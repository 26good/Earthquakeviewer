<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>地震監視モニター</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&family=DotGothic16&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: rgba(20, 20, 25, 0.85);
            --text-main: #ffffff;
            --text-sub: #a0a0a8;
            --border-radius: 12px;
            --blur: blur(20px);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #000; color: var(--text-main); 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            overflow: hidden; 
        }

        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background-color: #050508; }
        .leaflet-bottom.leaflet-right { bottom: 60px; right: 10px; }

        #sound-toggle {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
            padding: 8px 16px; color: var(--text-sub); cursor: pointer;
            font-size: 0.8rem; font-weight: bold; transition: 0.3s; pointer-events: auto;
        }
        #sound-toggle.active { color: #fff; border-color: #4cd0a7; background: rgba(76, 208, 167, 0.1); box-shadow: 0 0 10px rgba(76,208,167,0.3); }

        /* メインUIレイヤー (左側) */
        #ui-layer {
            position: absolute; top: 20px; left: 20px; width: 350px; height: calc(100vh - 40px);
            z-index: 1000; display: flex; flex-direction: column; gap: 15px; pointer-events: none; 
        }

        .glass-panel {
            background: var(--bg-dark); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--border-radius);
            padding: 15px; pointer-events: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 詳細情報パネル */
        #detail-panel {
            background: #202434; border-radius: var(--border-radius); overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; 
            font-family: 'Noto Sans JP', sans-serif; pointer-events: auto; flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s background;
        }

        .dp-header { display: flex; align-items: stretch; font-size: 1rem; font-weight: 900; }
        .dp-header-main { flex: 1; padding: 10px; display: flex; align-items: center; justify-content: center; }
        .dp-header-sub { padding: 10px; display: flex; align-items: center; justify-content: center; }

        /* EEW共通装飾 */
        #detail-panel.mode-eew .dp-header-main { color: #fff; letter-spacing: 1px; }
        #detail-panel.mode-eew .dp-intensity-label::before { content: "推定\A"; white-space: pre; font-size: 0.9rem; font-weight: bold; }
        #detail-panel.mode-eew .dp-footer-msg { color: #f4d03f; text-align: left; background: none; padding: 0; }

        /* EEW 警報の装飾 (赤) */
        #detail-panel.eew-warning .dp-header-main { background: repeating-linear-gradient(-45deg, #220000, #220000 10px, #440000 10px, #440000 20px); }
        #detail-panel.eew-warning .dp-header-sub { background: #d93b3b; color: #fff; font-size: 0.85rem; }
        #detail-panel.eew-warning .dp-intensity-box { background: #d33c30; }

        /* EEW 予報の装飾 (オレンジ) */
        #detail-panel.eew-forecast .dp-header-main { background: repeating-linear-gradient(-45deg, #332200, #332200 10px, #553300 10px, #553300 20px); }
        #detail-panel.eew-forecast .dp-header-sub { background: #d98c3b; color: #fff; font-size: 0.85rem; }
        #detail-panel.eew-forecast .dp-intensity-box { background: #d37e30; }
        
        /* 通常モードの装飾 */
        #detail-panel.mode-info .dp-header-main { background: #3b5078; color: #fff; width: 100%; }
        #detail-panel.mode-info .dp-header-sub { display: none; }
        #detail-panel.mode-info .dp-intensity-box { background: #4b89a8; }
        #detail-panel.mode-info .dp-place-row { display: flex; flex-direction: column-reverse; } 
        #detail-panel.mode-info .dp-footer-msg { background: #3c4961; color: #fff; text-align: center; padding: 10px; border-radius: 8px; }

        .dp-body { padding: 15px; }
        .dp-place-row { margin-bottom: 15px; }
        .dp-place { font-size: 1.4rem; font-weight: 900; line-height: 1.2; }
        .dp-place span { font-size: 0.85rem; font-weight: normal; margin-left: 5px; }
        .dp-time { font-size: 0.85rem; color: #ccc; margin-top: 5px; }

        .dp-intensity-box { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; }
        .dp-intensity-label { font-size: 1.1rem; font-weight: 900; line-height: 1.2; }
        .dp-intensity-val { font-size: 3.5rem; font-family: 'Inter', sans-serif; font-weight: 800; line-height: 1; }

        .dp-stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 1rem; }
        .dp-stat-val-group { display: flex; align-items: center; gap: 10px; }
        .dp-stat-val { font-size: 1.8rem; font-family: 'Inter', sans-serif; font-weight: 400; }
        .dp-stat-unit { font-size: 0.8rem; margin-left: 2px;}
        .dp-bar { width: 10px; height: 26px; border-radius: 2px; transition: 0.3s; }
        
        .dp-footer-msg { margin-top: 15px; font-weight: bold; font-size: 0.95rem; line-height: 1.4; }

        /* 履歴リスト */
        .history-panel { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; padding: 12px; }
        #history-list { overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        #history-list::-webkit-scrollbar { width: 4px; }
        #history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .history-item { display: flex; align-items: center; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 10px; gap: 10px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .history-item:hover { background: rgba(255, 255, 255, 0.1); }
        .hist-intensity-circle { min-width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DotGothic16', sans-serif; font-size: 1rem; border: 2px solid rgba(255,255,255,0.2); }
        .hist-info { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .hist-time { font-size: 0.65rem; color: var(--text-sub); }
        .hist-place { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #status-bar { position: absolute; bottom: 20px; right: 20px; z-index: 1000; background: var(--bg-dark); padding: 8px 16px; border-radius: 30px; font-size: 0.75rem; color: var(--text-sub); transition: 0.3s; }

        /* アイコン類 */
        .intensity-icon { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; font-family: 'DotGothic16', sans-serif; font-size: 18px; font-weight: bold; color: white; border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 0 10px rgba(0,0,0,0.6); text-shadow: 1px 1px 0 #000; }
        .epicenter-mark { font-size: 36px; font-weight: 900; color: #ff3333; line-height: 1; text-align: center; text-shadow: 0 0 4px #fff, 0 0 8px #fff; display: flex; align-items: center; justify-content: center; }
        .scale-10 { background: #4682B4; } .scale-20 { background: #2E8B57; } .scale-30 { background: #DAA520; } .scale-40 { background: #E67E22; } .scale-45 { background: #C0392B; } .scale-50 { background: #922B21; } .scale-55 { background: #8E44AD; } .scale-60 { background: #76448A; } .scale-70 { background: #512E5F; }
    </style>
</head>
<body>

<div id="map"></div>
<button id="sound-toggle" class="active">🔊 Sound ON</button>

<div id="ui-layer">
    <div id="detail-panel" class="mode-info">
        <div class="dp-header">
            <div class="dp-header-main" id="dp-title">読込中...</div>
            <div class="dp-header-sub" id="dp-serial"></div>
        </div>
        <div class="dp-body">
            <div class="dp-place-row">
                <div class="dp-place"><span id="dp-place-name">--</span><span id="dp-place-suffix"></span></div>
                <div class="dp-time" id="dp-time">--/-- --:--</div>
            </div>
            <div class="dp-intensity-box">
                <div class="dp-intensity-label" id="dp-int-label">最大震度</div>
                <div class="dp-intensity-val" id="dp-int-val">-</div>
            </div>
            <div class="dp-stat-row">
                <div>マグニチュード</div>
                <div class="dp-stat-val-group">
                    <div class="dp-stat-val" id="dp-mag">-.--</div>
                    <div class="dp-bar" id="bar-mag"></div>
                </div>
            </div>
            <div class="dp-stat-row">
                <div>深さ</div>
                <div class="dp-stat-val-group">
                    <div class="dp-stat-val" id="dp-depth">--</div>
                    <div class="dp-bar" id="bar-depth"></div>
                </div>
            </div>
            <div class="dp-footer-msg" id="dp-footer">--</div>
        </div>
    </div>

    <div class="glass-panel history-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
            <h2 style="font-size:0.8rem; margin:0; color:var(--text-sub);">地震履歴</h2>
            <span id="last-update" style="font-size:0.7rem; color:#4cd0a7; font-family: monospace;">--:--:--</span>
        </div>
        <div id="history-list"></div>
    </div>
</div>

<div id="status-bar">Connecting...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const APP_VERSION = "Ver 1.2"; // 更新のたびにここをカウントアップします
    document.getElementById('status-bar').innerText = `Connecting... | ${APP_VERSION}`;

    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([37.5, 137.5], 5.5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let japanGeoLayer = null, earthquakeDataMap = {}, markersLayer = L.layerGroup().addTo(map);
    let lastQuakeId = null;

    // --- サウンド ---
    let audioCtx = null, isSoundEnabled = true;
    document.getElementById('sound-toggle').addEventListener('click', function() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isSoundEnabled = !isSoundEnabled;
        this.innerText = isSoundEnabled ? '🔊 Sound ON' : '🔇 Sound OFF';
        this.classList.toggle('active', isSoundEnabled);
    });

    function playMasterTone(f1, f2, dur, vol, type = 'sine', delay = 0) {
        if (!isSoundEnabled) return;
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } 
            catch(e) { return; }
        }
        const now = audioCtx.currentTime + delay;
        [1, 1.005].forEach(detune => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type; o.frequency.setValueAtTime(f1 * detune, now);
            if (f2) o.frequency.exponentialRampToValueAtTime(f2 * detune, now + dur);
            g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(vol, now + 0.01); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + dur);
        });
    }

    function playDetect() { playMasterTone(400, 350, 0.18, 0.3); playMasterTone(550, 500, 0.22, 0.3, 'sine', 0.1); }
    function playUpdate() { playMasterTone(450, 400, 0.12, 0.25); }
    function playUrgent() { playMasterTone(200, 60, 0.8, 0.4, 'triangle'); playMasterTone(205, 65, 0.8, 0.2, 'sine', 0.01); }
    function playFinal()  { playMasterTone(320, 300, 0.25, 0.25); playMasterTone(240, 220, 0.4, 0.25, 'sine', 0.2); }

    // --- 色判定ロジック ---
    function getMagColor(mag) {
        if (mag >= 6.0) return '#e54d42'; 
        if (mag >= 4.0) return '#f39c12'; 
        return '#559dd6'; 
    }

    function getDepthColor(depth) {
        if (depth === "ごく浅い" || depth === 0) return '#e54d42'; 
        if (typeof depth !== 'number') return '#a0a0a8'; 
        if (depth <= 30) return '#e54d42'; 
        if (depth <= 100) return '#f39c12'; 
        return '#559dd6'; 
    }

    // --- 詳細パネル更新 ---
    function updateDetailPanel(mode, data) {
        const panel = document.getElementById('detail-panel');
        panel.className = `mode-${mode}`; 
        
        if (mode === 'eew') {
            const isWarning = data.title && data.title.includes('警報');
            
            document.getElementById('dp-title').innerText = data.title || "緊急地震速報";
            document.getElementById('dp-serial').innerText = "第" + (data.serial || "1") + "報";
            document.getElementById('dp-place-name').innerText = data.place;
            document.getElementById('dp-place-suffix').innerText = " で地震";
            document.getElementById('dp-time').innerText = data.time + " 発生";
            document.getElementById('dp-int-label').innerText = "最大震度";
            document.getElementById('dp-int-val').style.color = '#fff';

            if (isWarning) {
                panel.classList.add('eew-warning');
                document.getElementById('dp-footer').innerHTML = "緊急地震速報（警報）発表<br>強い揺れに警戒してください";
            } else {
                panel.classList.add('eew-forecast');
                document.getElementById('dp-footer').innerHTML = "緊急地震速報（予報）発表<br>今後の情報に注意してください";
            }
        } else {
            document.getElementById('dp-title').innerText = "ℹ 各地の震度情報";
            document.getElementById('dp-place-name').innerText = data.place;
            document.getElementById('dp-place-suffix').innerText = "で地震がありました";
            document.getElementById('dp-time').innerText = data.time + " ごろ";
            document.getElementById('dp-int-label').innerText = "最大震度";
            document.getElementById('dp-footer').innerHTML = data.tsunami || "津波の心配なし";
        }

        document.getElementById('dp-int-val').innerText = data.scaleStr;
        document.getElementById('dp-mag').innerText = data.mag === -1.0 ? "不明" : data.mag.toFixed(1);
        
        let depthVal = data.depth;
        if (depthVal === 0) depthVal = "ごく浅い";
        const depthUnit = typeof depthVal === 'number' ? "km" : "";
        document.getElementById('dp-depth').innerHTML = `${depthVal}<span class="dp-stat-unit">${depthUnit}</span>`;

        document.getElementById('bar-mag').style.backgroundColor = getMagColor(data.mag);
        document.getElementById('bar-depth').style.backgroundColor = getDepthColor(data.depth);
    }

    // --- 地図と履歴 ---
    fetch('https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson')
        .then(r => r.json()).then(data => { japanGeoLayer = L.geoJSON(data, { style: { color: '#444', weight: 1, fillColor: '#15151b', fillOpacity: 1 }}).addTo(map); });

    function getScaleText(scale) { return {10:'1',20:'2',30:'3',40:'4',45:'5-',50:'5+',55:'6-',60:'6+',70:'7'}[scale] || '?'; }

    async function fetchHistory() {
        try {
            const res = await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=20');
            const list = await res.json();
            const validQuakes = list.filter(eq => eq.earthquake?.hypocenter?.name && eq.earthquake.hypocenter.name !== '不明' && eq.earthquake.hypocenter.magnitude !== -1.0 && eq.points?.length > 0);

            const isNew = validQuakes.length > 0 && lastQuakeId && validQuakes[0].id !== lastQuakeId;
            if (isNew) {
                const newEq = validQuakes[0];
                if (newEq.earthquake.maxScale >= 50) playUrgent(); else playDetect();
                showEarthquakeOnMap(newEq.id, newEq);
            }
            if (validQuakes.length > 0) lastQuakeId = validQuakes[0].id;

            const container = document.getElementById('history-list');
            if(container.children.length === 0) {
                validQuakes.slice(0, 10).forEach(eq => {
                    earthquakeDataMap[eq.id] = eq;
                    const scale = eq.earthquake.maxScale;
                    const timeStr = eq.earthquake.time.substring(5, 16).replace('-', '/');

                    container.innerHTML += `
                        <div class="history-item" onclick="showEarthquakeOnMap('${eq.id}')">
                            <div class="hist-intensity-circle scale-${scale}">${getScaleText(scale)}</div>
                            <div class="hist-info">
                                <div class="hist-time">${timeStr}</div>
                                <div class="hist-place">${eq.earthquake.hypocenter.name}</div>
                            </div>
                        </div>`;
                });
                if (validQuakes.length > 0) showEarthquakeOnMap(validQuakes[0].id, validQuakes[0]);
            }
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString('ja-JP', { hour12: false });
        } catch (e) { console.error(e); }
    }

    window.showEarthquakeOnMap = function(id, directData = null) {
        const eq = directData || earthquakeDataMap[id];
        if (!eq) return;
        
        const dDate = new Date(eq.earthquake.time);
        const timeStr = `${dDate.getMonth()+1}月${dDate.getDate()}日 ${String(dDate.getHours()).padStart(2,'0')}:${String(dDate.getMinutes()).padStart(2,'0')}`;
        
        updateDetailPanel('info', {
            place: eq.earthquake.hypocenter.name,
            time: timeStr,
            scaleStr: getScaleText(eq.earthquake.maxScale),
            mag: eq.earthquake.hypocenter.magnitude,
            depth: eq.earthquake.hypocenter.depth,
            tsunami: eq.earthquake.domesticTsunami === "None" ? "津波の心配なし" : "津波警報・注意報発令中"
        });
        
        if (!japanGeoLayer) return;
        markersLayer.clearLayers();
        const prefScales = {}; 
        eq.points.forEach(p => { prefScales[p.pref] = Math.max(prefScales[p.pref] || 0, p.scale); });
        
        japanGeoLayer.eachLayer(layer => {
            let color = '#15151b'; let matchedPref = null;
            for (let p in prefScales) { 
                if (JSON.stringify(layer.feature.properties).includes(p.replace(/県|府|都/, ''))) {
                    color = {70:'#512E5F', 60:'#76448A', 55:'#8E44AD', 50:'#922B21', 45:'#C0392B', 40:'#E67E22', 30:'#DAA520', 20:'#2E8B57', 10:'#4682B4'}[prefScales[p]] || color;
                    matchedPref = p;
                }
            }
            layer.setStyle({ fillColor: color });
            if (matchedPref) {
                L.marker(layer.getBounds().getCenter(), { icon: L.divIcon({ className: '', html: `<div class="intensity-icon scale-${prefScales[matchedPref]}">${getScaleText(prefScales[matchedPref])}</div>`, iconSize: [32, 32], iconAnchor: [16, 16] }), interactive: false }).addTo(markersLayer);
            }
        });
        const { latitude: lat, longitude: lng } = eq.earthquake.hypocenter;
        if (lat > 0) L.marker([lat, lng], { icon: L.divIcon({ className: 'epicenter-mark', html: `×`, iconSize: [40, 40], iconAnchor: [20, 20] }), interactive: false }).addTo(markersLayer);
    };

    // --- EEW WebSocket ---
    function connectEEW() {
        const ws = new WebSocket('wss://ws-api.wolfx.jp/jma_eew');
        ws.onopen = () => { document.getElementById('status-bar').innerText = `System Online / EEW Connected | ${APP_VERSION}`; };
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'jma_eew' && !data.isCancel) {
                    if (data.isFinal) playFinal(); else playUpdate();
                    
                    updateDetailPanel('eew', {
                        title: data.Title,
                        place: data.Hypocenter || "不明",
                        time: data.OriginTime || "--:--:--",
                        scaleStr: data.MaxInt || "-",
                        mag: parseFloat(data.Magunitude || data.Magnitude || "0"),
                        depth: parseInt(data.Depth || "0"),
                        serial: data.Serial || "1"
                    });
                }
            } catch (e) { console.error('EEW Parse Error:', e); }
        };
        ws.onclose = () => { document.getElementById('status-bar').innerText = `Connection Lost. Reconnecting... | ${APP_VERSION}`; setTimeout(connectEEW, 5000); };
    }

    fetchHistory(); setInterval(fetchHistory, 60000); connectEEW();
</script>
</body>
</html>
